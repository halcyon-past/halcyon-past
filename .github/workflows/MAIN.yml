# GitHub Action for generating a contribution graph with a snake eating your contributions.

name: Generate Snake

permissions: 
  contents: write

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Generate Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg
            assets/github-snake-dark.svg?palette=github-dark
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Commit snake SVGs to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet assets/github-snake.svg assets/github-snake-dark.svg; then
            echo "No changes in snake SVGs."
          else
            git add assets/github-snake.svg assets/github-snake-dark.svg
            git commit -m "chore: update contribution snake [skip ci]"
            git push origin main
          fi

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
