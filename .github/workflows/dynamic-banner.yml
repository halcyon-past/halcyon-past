name: Dynamic Day-Night Banner & Views Sync

on:
  schedule:
    # Runs every 2 hours
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-banner:
    name: Update Banner & Sync Profile Views
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Determine Day or Night (Asia/Kolkata)
        run: |
          HOUR=$(TZ='Asia/Kolkata' date +%H)
          echo "Current hour in Asia/Kolkata: $HOUR"
          
          # Daytime is defined as 06:00 to 18:00 IST
          if [ "$HOUR" -ge 6 ] && [ "$HOUR" -lt 18 ]; then
            echo "Daytime detected. Setting daytime banner."
            cp assets/banner-day.svg assets/current-banner.svg
          else
            echo "Nighttime detected. Setting nighttime banner."
            cp assets/banner-night.svg assets/current-banner.svg
          fi

      - name: Sync Profile Views Count from Komarev
        run: |
          LIVE_COUNT=$(curl -s --max-time 10 "https://komarev.com/ghpvc/?username=halcyon-past" | grep -oE '>[0-9,]+<' | tr -d '><' | tail -n 1)
          if [ -n "$LIVE_COUNT" ]; then
            echo "Synced count: $LIVE_COUNT"
            python3 -c "
import re
count = '$LIVE_COUNT'
with open('assets/profile-views.svg', 'r') as f:
    c = f.read()
c = re.sub(r'>\d[0-9,]*</text>', f'>{count}</text>', c)
c = re.sub(r'Profile Views: \d[0-9,]*', f'Profile Views: {count}', c)
with open('assets/profile-views.svg', 'w') as f:
    f.write(c)
"
          fi

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add assets/current-banner.svg assets/profile-views.svg
          if git diff --staged --quiet; then
            echo "No changes needed."
          else
            git commit -m "chore: auto-sync banner & profile views count [skip ci]"
            git push
          fi
