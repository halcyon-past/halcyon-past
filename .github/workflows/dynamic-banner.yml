name: Sync Profile Views

on:
  schedule:
    # Runs every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-views:
    name: Sync Profile Views Counter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Sync Profile Views Count from Komarev
        run: |
          LIVE_COUNT=$(curl -s --max-time 10 "https://komarev.com/ghpvc/?username=halcyon-past" | grep -oE '>[0-9,]+<' | tr -d '><' | tail -n 1)
          if [ -n "$LIVE_COUNT" ]; then
            echo "Synced count: $LIVE_COUNT"
            python3 -c "
import re
count = '$LIVE_COUNT'
with open('assets/profile-views.svg', 'r') as f:
    c = f.read()
c = re.sub(r'>\d[0-9,]*</text>', f'>{count}</text>', c)
c = re.sub(r'Profile Views: \d[0-9,]*', f'Profile Views: {count}', c)
with open('assets/profile-views.svg', 'w') as f:
    f.write(c)
"
          fi

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add assets/profile-views.svg
          if git diff --staged --quiet; then
            echo "No changes needed."
          else
            git commit -m "chore: auto-sync profile views count [skip ci]"
            git push
          fi
