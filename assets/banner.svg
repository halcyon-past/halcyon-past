<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="220">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgObsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04050a" />
      <stop offset="50%" stop-color="#0a0d18" />
      <stop offset="100%" stop-color="#05060c" />
    </linearGradient>

    <!-- Titanium Headline Gradient -->
    <linearGradient id="titaniumText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Scanning Laser Beam Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Top Hairline Energy Sweep -->
    <linearGradient id="energyBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
      <animate attributeName="x1" values="-100%;100%;-100%" dur="7s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%;0%" dur="7s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Blueprint Dot Grid Lattice -->
    <pattern id="hudGrid" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.04" />
    </pattern>

    <!-- Ambient Glow Blur Filter -->
    <filter id="meshGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <style>
    .name-title {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif;
      font-weight: 800;
      font-size: 32px;
      letter-spacing: -0.8px;
      fill: url(#titaniumText);
      animation: titleBreath 4s ease-in-out infinite;
    }
    .role-title {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif;
      font-weight: 500;
      font-size: 14.5px;
      letter-spacing: -0.2px;
      fill: #cbd5e1;
    }
    .mission-desc {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      font-weight: 400;
      font-size: 12.5px;
      fill: #94a3b8;
    }
    .mono-hud {
      font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, monospace;
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    .chip-style {
      font-family: 'SF Mono', 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #cbd5e1;
    }
    .stage-title {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 11px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: 0.3px;
    }
    .stage-sub {
      font-family: 'SF Mono', monospace;
      font-size: 9px;
      font-weight: 500;
      fill: #94a3b8;
    }

    @keyframes titleBreath {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(129, 140, 248, 0.3)); }
      50% { filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.6)); }
    }
    @keyframes laserSweep {
      0% { transform: translateX(-150px); opacity: 0; }
      15% { opacity: 0.8; }
      85% { opacity: 0.8; }
      100% { transform: translateX(1100px); opacity: 0; }
    }
    .laser-line {
      animation: laserSweep 5.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>

  <!-- Container Base -->
  <rect width="960" height="220" rx="14" fill="url(#bgObsidian)"/>
  <rect width="960" height="220" rx="14" fill="url(#hudGrid)"/>

  <!-- Ambient Light Mesh Glows -->
  <g filter="url(#meshGlow)">
    <circle cx="120" cy="180" r="100" fill="#4f46e5" fill-opacity="0.14" />
    <circle cx="820" cy="70" r="120" fill="#818cf8" fill-opacity="0.15" />
    <circle cx="500" cy="220" r="90" fill="#06b6d4" fill-opacity="0.08" />
  </g>

  <!-- Animated Laser Scanner Sweep Beam -->
  <g class="laser-line">
    <rect x="0" y="0" width="60" height="220" fill="url(#laserGrad)" opacity="0.6"/>
    <line x1="30" y1="0" x2="30" y2="220" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
  </g>

  <!-- Top Hairline Border Energy Beam -->
  <rect x="0" y="0" width="960" height="1.5" fill="url(#energyBeam)" />

  <!-- Outer Bezel Stroke -->
  <rect x="0.5" y="0.5" width="959" height="219" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- HUD Corner Brackets -->
  <g stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M 18 28 L 18 18 L 28 18" />
    <path d="M 942 28 L 942 18 L 932 18" />
    <path d="M 18 192 L 18 202 L 28 202" />
    <path d="M 942 192 L 942 202 L 932 202" />
  </g>

  <!-- ==================== LEFT COLUMN: INTRO & IDENTITY ==================== -->

  <!-- Telemetry Status Bar -->
  <g transform="translate(48, 28)">
    <rect width="185" height="22" rx="11" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <!-- Pulsing Radar Indicator -->
    <circle cx="13" cy="11" r="4" fill="none" stroke="#818cf8" stroke-width="1.2">
      <animate attributeName="r" values="3;9;9" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0;0" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="13" cy="11" r="3" fill="#818cf8"/>
    <text x="26" y="15" class="mono-hud" fill="#e2e8f0">SYS_ONLINE <tspan fill="#64748b">//</tspan> HYD, IN</text>
    <text x="232" y="15" class="mono-hud" fill="#64748b">17.3850° N, 78.4867° E</text>
  </g>

  <!-- Kinetic Title Reveal -->
  <text x="48" y="84" class="name-title">ARITRO SAHA</text>
  <text x="48" y="110" class="role-title">Software Engineer 1 <tspan fill="#64748b">•</tspan> <tspan fill="#f8fafc" font-weight="600">Bristol Myers Squibb</tspan></text>
  <text x="48" y="133" class="mission-desc">Engineering intelligent big data pipelines &amp; scalable GenAI systems.</text>

  <!-- Core Stack Badges -->
  <g transform="translate(48, 156)">
    <!-- Python -->
    <g transform="translate(0, 0)">
      <rect width="80" height="25" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1"/>
      <circle cx="12" cy="12.5" r="3" fill="#38bdf8"/>
      <text x="22" y="16.5" class="chip-style">Python</text>
    </g>
    <!-- AWS -->
    <g transform="translate(88, 0)">
      <rect width="66" height="25" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="1"/>
      <circle cx="12" cy="12.5" r="3" fill="#f59e0b"/>
      <text x="22" y="16.5" class="chip-style">AWS</text>
    </g>
    <!-- Databricks -->
    <g transform="translate(162, 0)">
      <rect width="106" height="25" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#ef4444" stroke-opacity="0.35" stroke-width="1"/>
      <circle cx="12" cy="12.5" r="3" fill="#ef4444"/>
      <text x="22" y="16.5" class="chip-style">Databricks</text>
    </g>
    <!-- GenAI -->
    <g transform="translate(276, 0)">
      <rect width="76" height="25" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#a855f7" stroke-opacity="0.35" stroke-width="1"/>
      <circle cx="12" cy="12.5" r="3" fill="#a855f7"/>
      <text x="22" y="16.5" class="chip-style">GenAI</text>
    </g>
  </g>

  <!-- ==================== RIGHT COLUMN: ARCHITECTURAL PIPELINE ==================== -->
  <g transform="translate(510, 24)">
    <!-- Backplate Card -->
    <rect width="400" height="172" rx="12" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    
    <!-- Card Header -->
    <text x="18" y="24" class="mono-hud" fill="#94a3b8">ARCHITECTURE // DATA &amp; AI PIPELINE</text>
    <circle cx="376" cy="20" r="3.5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>

    <!-- Pipeline Bus Lines -->
    <!-- Line 1: Ingest to Databricks -->
    <line x1="110" y1="80" x2="160" y2="80" stroke="#334155" stroke-width="2" stroke-dasharray="4 3" />
    <line x1="110" y1="80" x2="160" y2="80" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 35">
      <animate attributeName="stroke-dashoffset" values="43;0" dur="1.2s" repeatCount="indefinite" />
    </line>

    <!-- Line 2: Databricks to GenAI -->
    <line x1="260" y1="80" x2="305" y2="80" stroke="#334155" stroke-width="2" stroke-dasharray="4 3" />
    <line x1="260" y1="80" x2="305" y2="80" stroke="#818cf8" stroke-width="2" stroke-dasharray="8 35">
      <animate attributeName="stroke-dashoffset" values="43;0" dur="1.2s" repeatCount="indefinite" />
    </line>

    <!-- Pipeline Node 1: Ingest (AWS Cloud) -->
    <g transform="translate(18, 50)">
      <rect width="92" height="60" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <text x="12" y="24" class="stage-title">INGEST</text>
      <text x="12" y="40" class="stage-sub">AWS S3 / Event</text>
      <text x="12" y="52" class="stage-sub">Stream Pipeline</text>
      <circle cx="78" cy="20" r="2.5" fill="#38bdf8"/>
    </g>

    <!-- Pipeline Node 2: Transform (Databricks) -->
    <g transform="translate(160, 50)">
      <rect width="100" height="60" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1"/>
      <text x="12" y="24" class="stage-title">DATABRICKS</text>
      <text x="12" y="40" class="stage-sub">PySpark Lakehouse</text>
      <text x="12" y="52" class="stage-sub">Delta Tables</text>
      <circle cx="86" cy="20" r="2.5" fill="#818cf8"/>
    </g>

    <!-- Pipeline Node 3: Intelligence (GenAI) -->
    <g transform="translate(305, 50)">
      <rect width="80" height="60" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#c084fc" stroke-opacity="0.45" stroke-width="1"/>
      <text x="12" y="24" class="stage-title">GENAI</text>
      <text x="12" y="40" class="stage-sub">LLM Agents</text>
      <text x="12" y="52" class="stage-sub">Inference API</text>
      <circle cx="68" cy="20" r="2.5" fill="#c084fc"/>
    </g>

    <!-- Pipeline Telemetry Bar at Bottom -->
    <g transform="translate(18, 130)">
      <rect width="365" height="26" rx="6" fill="#0b0f19" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
      <text x="12" y="17" class="mono-hud" fill="#64748b">THROUGHPUT: <tspan fill="#38bdf8">SCALE</tspan> | LATENCY: <tspan fill="#22c55e">&lt;10ms</tspan> | STATUS: <tspan fill="#cbd5e1">OPTIMAL</tspan></text>
    </g>
  </g>
</svg>
