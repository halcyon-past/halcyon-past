<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="240">
  <defs>
    <!-- Background Daytime Sky Gradient -->
    <linearGradient id="dayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b5c" />
      <stop offset="35%" stop-color="#1d4ed8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Sun Radial Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>

    <!-- Wave Gradients -->
    <linearGradient id="dayWave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="dayWave2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12" />
    </linearGradient>

    <!-- Glassmorphism Pill -->
    <linearGradient id="dayPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="dayTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: -0.5px;
      fill: url(#dayTitleGrad);
      animation: dayTitleGlow 4s ease-in-out infinite;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 17px;
      fill: #e0f2fe;
    }
    .badge-text {
      font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
      font-size: 11px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .tag-text {
      font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace;
      font-size: 13px;
      font-weight: 600;
      fill: #fef08a;
    }

    /* Keyframe Animations */
    @keyframes dayTitleGlow {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(254, 240, 138, 0.4)); }
      50% { filter: drop-shadow(0 0 16px rgba(250, 204, 21, 0.7)); }
    }

    @keyframes rotateSunRays {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pulseSunGlow {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    @keyframes waveSlide1 {
      0% { transform: translateX(0); }
      50% { transform: translateX(-50px); }
      100% { transform: translateX(0); }
    }
    @keyframes waveSlide2 {
      0% { transform: translateX(0); }
      50% { transform: translateX(45px); }
      100% { transform: translateX(0); }
    }

    @keyframes dayBeacon {
      0% { r: 5px; opacity: 0.9; }
      100% { r: 13px; opacity: 0; }
    }

    .anim-sun-glow { transform-origin: 880px 50px; animation: pulseSunGlow 5s ease-in-out infinite; }
    .anim-sun-rays { transform-origin: 880px 80px; animation: rotateSunRays 20s linear infinite; }
    .anim-wave1 { animation: waveSlide1 7s ease-in-out infinite; }
    .anim-wave2 { animation: waveSlide2 9s ease-in-out infinite; }
    .beacon-pulse { animation: dayBeacon 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1000" height="240" rx="16" fill="url(#dayGrad)"/>

  <!-- Pulsing Solar Aura -->
  <circle cx="880" cy="50" r="150" fill="url(#sunGlow)" class="anim-sun-glow"/>
  <circle cx="120" cy="220" r="180" fill="#ffffff" fill-opacity="0.06"/>

  <!-- Rotating Sun Icon on Right -->
  <g class="anim-sun-rays" fill="none" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round">
    <circle cx="880" cy="80" r="16" fill="#facc15" fill-opacity="0.9" stroke="#fde047" stroke-width="2" filter="drop-shadow(0 0 10px rgba(250, 204, 21, 0.8))"/>
    <line x1="880" y1="52" x2="880" y2="60"/>
    <line x1="880" y1="100" x2="880" y2="108"/>
    <line x1="852" y1="80" x2="860" y2="80"/>
    <line x1="900" y1="80" x2="908" y2="80"/>
    <line x1="860" y1="60" x2="866" y2="66"/>
    <line x1="894" y1="94" x2="900" y2="100"/>
    <line x1="860" y1="100" x2="866" y2="94"/>
    <line x1="894" y1="66" x2="900" y2="60"/>
  </g>

  <!-- Animated Undulating Waves at Bottom -->
  <g class="anim-wave1">
    <path d="M -60 170 Q 200 130 520 170 T 1060 150 L 1060 250 L -60 250 Z" fill="url(#dayWave1)"/>
  </g>
  <g class="anim-wave2">
    <path d="M -50 195 Q 300 165 670 198 T 1060 185 L 1060 250 L -50 250 Z" fill="url(#dayWave2)"/>
  </g>
  <path d="M 0 205 Q 340 180 700 210 T 1000 198 L 1000 240 L 0 240 Z" fill="#ffffff" fill-opacity="0.12"/>

  <!-- Mode Badge (Daytime - HYD) with Pulsing Beacon -->
  <g transform="translate(60, 36)">
    <rect width="195" height="26" rx="13" fill="url(#dayPill)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
    <!-- Animated Beacon -->
    <circle cx="16" cy="13" r="5" fill="#facc15" class="beacon-pulse" stroke="#fde047" stroke-width="1.5"/>
    <circle cx="16" cy="13" r="4.5" fill="#f59e0b"/>
    <text x="32" y="17" class="badge-text">☀️ DAYTIME IN HYD</text>
  </g>

  <!-- Main Headline & Subtitle -->
  <text x="60" y="105" class="title">Hey, I'm Aritro Saha</text>
  <text x="60" y="138" class="subtitle">Software Engineer 1 at Bristol Myers Squibb</text>

  <!-- Tech Focus Bar -->
  <g transform="translate(60, 168)">
    <text x="0" y="0" class="tag-text">Python  •  AWS  •  Databricks  •  GenAI  •  Full-Stack</text>
  </g>
</svg>
