<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 240" width="100%" height="240">
  <defs>
    <!-- Daytime Gradient -->
    <linearGradient id="dayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c234b" />
      <stop offset="35%" stop-color="#1e40af" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <!-- Top Border Beam Gradient -->
    <linearGradient id="dayBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#fde047" stop-opacity="0.9">
        <animate attributeName="stop-color" values="#fde047;#38bdf8;#fed7aa;#fde047" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
      <animate attributeName="x1" values="-100%;100%;-100%" dur="7s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%;0%" dur="7s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Sun Radial Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>

    <!-- Liquid Day Wave Gradients -->
    <linearGradient id="dayWave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="dayWave2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15" />
    </linearGradient>

    <!-- Glassmorphism Pill -->
    <linearGradient id="dayPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="dayTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: -0.5px;
      fill: url(#dayTitleGrad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 17px;
      fill: #e0f2fe;
    }
    .badge-text {
      font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
      font-size: 11px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .tag-text {
      font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace;
      font-size: 13px;
      font-weight: 600;
      fill: #fef08a;
    }
  </style>

  <!-- Background Base -->
  <rect width="1000" height="240" rx="16" fill="url(#dayGrad)"/>

  <!-- Top Glowing Border Beam -->
  <rect x="0" y="0" width="1000" height="3" fill="url(#dayBeam)" rx="1.5"/>

  <!-- Pulsing Solar Aura with SMIL -->
  <circle cx="880" cy="50" r="140" fill="url(#sunGlow)">
    <animate attributeName="r" values="130;165;130" dur="4.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.75;1;0.75" dur="4.5s" repeatCount="indefinite" />
  </circle>

  <!-- Ambient Light Orbs -->
  <circle cx="120" cy="220" r="170" fill="#ffffff" fill-opacity="0.06">
    <animate attributeName="cy" values="220;205;220" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- Rotating Sun Icon on Right with SMIL -->
  <g fill="none" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 880 75" to="360 880 75" dur="18s" repeatCount="indefinite" />
      <circle cx="880" cy="75" r="16" fill="#facc15" fill-opacity="0.95" stroke="#fde047" stroke-width="2" />
      <line x1="880" y1="47" x2="880" y2="55"/>
      <line x1="880" y1="95" x2="880" y2="103"/>
      <line x1="852" y1="75" x2="860" y2="75"/>
      <line x1="900" y1="75" x2="908" y2="75"/>
      <line x1="860" y1="55" x2="866" y2="61"/>
      <line x1="894" y1="89" x2="900" y2="95"/>
      <line x1="860" y1="95" x2="866" y2="89"/>
      <line x1="894" y1="61" x2="900" y2="55"/>
    </g>
  </g>

  <!-- Fluid Morphing Undulating Day Waves with SMIL -->
  <path fill="url(#dayWave1)">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="
        M -50 170 Q 200 130 520 170 T 1050 150 L 1050 240 L -50 240 Z;
        M -50 160 Q 240 180 500 145 T 1050 165 L 1050 240 L -50 240 Z;
        M -50 170 Q 200 130 520 170 T 1050 150 L 1050 240 L -50 240 Z
      " />
  </path>

  <path fill="url(#dayWave2)">
    <animate attributeName="d" dur="10s" repeatCount="indefinite"
      values="
        M -50 195 Q 300 165 670 198 T 1050 185 L 1050 240 L -50 240 Z;
        M -50 185 Q 260 205 640 175 T 1050 195 L 1050 240 L -50 240 Z;
        M -50 195 Q 300 165 670 198 T 1050 185 L 1050 240 L -50 240 Z
      " />
  </path>

  <path d="M 0 208 Q 340 185 700 214 T 1000 202 L 1000 240 L 0 240 Z" fill="#ffffff" fill-opacity="0.14"/>

  <!-- Mode Badge (Daytime - HYD) with Pulsing Radar Beacon -->
  <g transform="translate(60, 36)">
    <rect width="195" height="26" rx="13" fill="url(#dayPill)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
    <!-- Radar Expanding Ring -->
    <circle cx="16" cy="13" r="5" fill="none" stroke="#fde047" stroke-width="1.5">
      <animate attributeName="r" values="4;13;13" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0;0" dur="2s" repeatCount="indefinite" />
    </circle>
    <!-- Core Dot -->
    <circle cx="16" cy="13" r="4.5" fill="#f59e0b"/>
    <text x="32" y="17" class="badge-text">☀️ DAYTIME IN HYD</text>
  </g>

  <!-- Main Headline & Subtitle -->
  <text x="60" y="105" class="title">Hey, I'm Aritro Saha</text>
  <text x="60" y="138" class="subtitle">Software Engineer 1 at Bristol Myers Squibb</text>

  <!-- Tech Focus Bar -->
  <g transform="translate(60, 168)">
    <text x="0" y="0" class="tag-text">Python  •  AWS  •  Databricks  •  GenAI  •  Full-Stack</text>
  </g>
</svg>
