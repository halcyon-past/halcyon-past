<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="220">
  <defs>
    <!-- Background Daytime Space Obsidian -->
    <linearGradient id="bgGradDay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060912" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Titanium Headline Gradient -->
    <linearGradient id="titleGradDay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Top Border Hairline Beam (Daytime Amber / Azure) -->
    <linearGradient id="beamGradDay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
      <animate attributeName="x1" values="-100%;100%;-100%" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%;0%" dur="8s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Blueprint Dot Grid Lattice -->
    <pattern id="dotGridDay" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.04" />
    </pattern>

    <!-- Ambient Aurora Glow Blur -->
    <filter id="auroraGlowDay" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <style>
    .name {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif;
      font-weight: 700;
      font-size: 30px;
      letter-spacing: -0.8px;
      fill: url(#titleGradDay);
    }
    .role {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: -0.2px;
      fill: #cbd5e1;
    }
    .mission {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      font-weight: 400;
      font-size: 12.5px;
      fill: #94a3b8;
    }
    .mono {
      font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, monospace;
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.4px;
    }
    .chip-label {
      font-family: 'SF Mono', 'JetBrains Mono', monospace;
      font-size: 10.5px;
      font-weight: 600;
      fill: #cbd5e1;
    }
    .node-title {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 11px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: 0.2px;
    }
    .node-sub {
      font-family: 'SF Mono', monospace;
      font-size: 9px;
      font-weight: 500;
      fill: #94a3b8;
    }
  </style>

  <!-- Base Card -->
  <rect width="960" height="220" rx="14" fill="url(#bgGradDay)"/>
  <rect width="960" height="220" rx="14" fill="url(#dotGridDay)"/>

  <!-- Apple Ambient Aurora Glows (Solar Daytime Aura) -->
  <g filter="url(#auroraGlowDay)">
    <circle cx="100" cy="180" r="100" fill="#0284c7" fill-opacity="0.14" />
    <circle cx="820" cy="70" r="120" fill="#f59e0b" fill-opacity="0.15" />
    <circle cx="650" cy="180" r="90" fill="#38bdf8" fill-opacity="0.08" />
  </g>

  <!-- Top Hairline Energy Beam -->
  <rect x="0" y="0" width="960" height="1.5" fill="url(#beamGradDay)" />

  <!-- Outer Bezel Stroke -->
  <rect x="0.5" y="0.5" width="959" height="219" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- ==================== LEFT COLUMN: IDENTITY & MISSION ==================== -->

  <!-- Status Chip -->
  <g transform="translate(48, 28)">
    <rect width="185" height="22" rx="11" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <!-- Radar Pulse -->
    <circle cx="13" cy="11" r="4" fill="none" stroke="#f59e0b" stroke-width="1.2">
      <animate attributeName="r" values="3;9;9" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0;0" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="13" cy="11" r="3" fill="#f59e0b"/>
    <text x="26" y="15" class="mono" fill="#e2e8f0">SYS_ONLINE <tspan fill="#64748b">//</tspan> HYD, IN</text>
  </g>

  <!-- Name & Professional Title -->
  <text x="48" y="82" class="name">Aritro Saha</text>
  <text x="48" y="108" class="role">Software Engineer 1 <tspan fill="#64748b">•</tspan> <tspan fill="#f8fafc" font-weight="600">Bristol Myers Squibb</tspan></text>
  <text x="48" y="132" class="mission">Engineering intelligent big data pipelines &amp; scalable GenAI systems.</text>

  <!-- Core Stack Badges (Sleek, Proportional, No Overflow) -->
  <g transform="translate(48, 156)">
    <!-- Python -->
    <g transform="translate(0, 0)">
      <rect width="78" height="24" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="12" cy="12" r="3" fill="#38bdf8"/>
      <text x="22" y="16" class="chip-label">Python</text>
    </g>
    <!-- AWS -->
    <g transform="translate(86, 0)">
      <rect width="64" height="24" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="12" cy="12" r="3" fill="#f59e0b"/>
      <text x="22" y="16" class="chip-label">AWS</text>
    </g>
    <!-- Databricks -->
    <g transform="translate(158, 0)">
      <rect width="104" height="24" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="12" cy="12" r="3" fill="#ef4444"/>
      <text x="22" y="16" class="chip-label">Databricks</text>
    </g>
    <!-- GenAI -->
    <g transform="translate(270, 0)">
      <rect width="74" height="24" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="12" cy="12" r="3" fill="#a855f7"/>
      <text x="22" y="16" class="chip-label">GenAI</text>
    </g>
  </g>

  <!-- ==================== RIGHT COLUMN: ARCHITECTURAL PIPELINE ==================== -->
  <g transform="translate(510, 24)">
    <!-- Backplate Card -->
    <rect width="400" height="172" rx="12" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    
    <!-- Card Header -->
    <text x="18" y="24" class="mono" fill="#94a3b8">ARCHITECTURE // DATA &amp; AI PIPELINE</text>
    <circle cx="376" cy="20" r="3.5" fill="#f59e0b">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>

    <!-- Pipeline Bus Lines -->
    <!-- Line 1: Ingest to Databricks -->
    <line x1="110" y1="80" x2="160" y2="80" stroke="#334155" stroke-width="2" stroke-dasharray="4 3" />
    <line x1="110" y1="80" x2="160" y2="80" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 35">
      <animate attributeName="stroke-dashoffset" values="43;0" dur="1.2s" repeatCount="indefinite" />
    </line>

    <!-- Line 2: Databricks to GenAI -->
    <line x1="260" y1="80" x2="305" y2="80" stroke="#334155" stroke-width="2" stroke-dasharray="4 3" />
    <line x1="260" y1="80" x2="305" y2="80" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 35">
      <animate attributeName="stroke-dashoffset" values="43;0" dur="1.2s" repeatCount="indefinite" />
    </line>

    <!-- Pipeline Node 1: Ingest (AWS Cloud) -->
    <g transform="translate(18, 50)">
      <rect width="92" height="60" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1"/>
      <text x="12" y="24" class="node-title">INGEST</text>
      <text x="12" y="40" class="node-sub">AWS S3 / Event</text>
      <text x="12" y="52" class="node-sub">Real-time Stream</text>
      <circle cx="78" cy="20" r="2.5" fill="#38bdf8"/>
    </g>

    <!-- Pipeline Node 2: Transform (Databricks) -->
    <g transform="translate(160, 50)">
      <rect width="100" height="60" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#0ea5e9" stroke-opacity="0.35" stroke-width="1"/>
      <text x="12" y="24" class="node-title">DATABRICKS</text>
      <text x="12" y="40" class="node-sub">PySpark Lakehouse</text>
      <text x="12" y="52" class="node-sub">Delta Tables</text>
      <circle cx="86" cy="20" r="2.5" fill="#0ea5e9"/>
    </g>

    <!-- Pipeline Node 3: Intelligence (GenAI) -->
    <g transform="translate(305, 50)">
      <rect width="80" height="60" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1"/>
      <text x="12" y="24" class="node-title">GENAI</text>
      <text x="12" y="40" class="node-sub">LLM Agents</text>
      <text x="12" y="52" class="node-sub">Inference</text>
      <circle cx="68" cy="20" r="2.5" fill="#f59e0b"/>
    </g>

    <!-- Pipeline Telemetry Bar at Bottom -->
    <g transform="translate(18, 130)">
      <rect width="365" height="26" rx="6" fill="#0b0f19" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
      <text x="12" y="17" class="mono" fill="#64748b">THROUGHPUT: <tspan fill="#38bdf8">SCALE</tspan>  |  LATENCY: <tspan fill="#22c55e">LOW</tspan>  |  MODE: <tspan fill="#f59e0b">DAY</tspan></text>
    </g>
  </g>
</svg>
